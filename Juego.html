<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Siete y media</title>
    <script src="js/script.js"></script>
    <link rel="stylesheet" href="css/estilos.css" />
    <link rel="shortcut icon" href="images/icono.png" type="image/png" />
  </head>
  <body onclick="playaudio()">
    <div id="pantalla-inicio" class="overlay">
      <div class="mensaje-bienvenida">
        <h1>Siete y Media</h1>
        <p>¿Podrás vencer a la banca sin pasarte?</p>
        <button onclick="comenzarJuego()">Empezar Partida</button>
      </div>
    </div>
    <div class="tablero">
      <div id="tapete" class="zona-cartas"></div>
      <p id="puntaje-jugador"></p>
      <div class="controles">
        <button onclick="SacarCarta()">Sacar Carta</button>
        <button onclick="Plantarse()">Plantarse</button>
      </div>
      <p id="puntaje-maquina"></p>
      <div id="maquina" class="zona-cartas"></div>
      <div id="pantalla-final" class="oculto">
        <div class="contenido-modal">
          <img id="imagen-final" src="" alt="Imagen Final" /> <br />
          <button id="cerrar-modal">Volver a jugar</button>
        </div>
      </div>
      <div id="mazo-decorativo">
        <div class="carta-reverso"></div>
        <div class="carta-reverso"></div>
        <div class="carta-reverso shadow-mazo" id="logo">
            <img src="images/icono.png" id="centrarlogo" height="50px" width="50px">
        </div>
      </div>
    </div>
    <audio id="audio" autoplay loop>
      <source src="audio/musica.mp3" type="audio/mpeg" />
      <source src="audio/musica.ogg" type="audio/ogg" />
    </audio>
  </body>
</html>
